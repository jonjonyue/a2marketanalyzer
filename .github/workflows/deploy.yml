name: Refresh data and deploy dashboard

on:
  push:
    branches: [main]
  schedule:
    # GitHub drops many scheduled runs on free repos, so ask three times an hour to get roughly hourly refreshes.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch market snapshot from aion2.exchange
        run: python scripts/fetch_snapshot.py --out site/data/snapshot.json

      # GitHub Pages lets browsers cache files for 10 minutes; versioned URLs make a deploy show up immediately.
      - name: Cache-bust script and style URLs
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=$v\"|; s|src=\"app.js\"|src=\"app.js?v=$v\"|" site/index.html
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=$v\"|; s|src=\"ledger.js\"|src=\"ledger.js?v=$v\"|" site/ledger.html
          sed -i "s|from \"./metrics.js\"|from \"./metrics.js?v=$v\"|" site/app.js site/ledger.js
          grep -q "app.js?v=$v" site/index.html && grep -q "metrics.js?v=$v" site/app.js && grep -q "ledger.js?v=$v" site/ledger.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
