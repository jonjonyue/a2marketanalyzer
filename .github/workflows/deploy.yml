name: Refresh data and deploy dashboard

on:
  push:
    branches: [main]
  schedule:
    # GitHub drops many scheduled runs on free repos, so ask three times an hour to get roughly hourly refreshes.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch market snapshot from aion2.exchange
        # A server that fails keeps its last published data (read back from the live site).
        run: python scripts/fetch_snapshot.py --out site/data/snapshot.json --fallback "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"

      # GitHub Pages lets browsers cache files for 10 minutes; versioned URLs make a deploy show up immediately.
      - name: Cache-bust script and style URLs
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=$v\"|; s|src=\"app.js\"|src=\"app.js?v=$v\"|" site/index.html
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=$v\"|; s|src=\"ledger.js\"|src=\"ledger.js?v=$v\"|" site/ledger.html
          sed -i "s|from \"./metrics.js\"|from \"./metrics.js?v=$v\"|" site/app.js site/ledger.js site/plan.js
          sed -i "s|from \"./plan.js\"|from \"./plan.js?v=$v\"|" site/app.js site/ledger.js
          grep -q "app.js?v=$v" site/index.html && grep -q "metrics.js?v=$v" site/app.js && grep -q "ledger.js?v=$v" site/ledger.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # GitHub sometimes leaves a Pages deployment stuck "in progress", which blocks every later deploy.
      # Only one run deploys at a time (concurrency group), so anything still in progress here is stuck: cancel it.
      # Cancelling an already finished deployment is a no-op error, which is ignored.
      - name: Clear stuck Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=5" -q '.[].sha' | sort -u); do
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments/$sha/cancel" >/dev/null 2>&1 && echo "cancelled stuck deployment $sha" || true
          done

      - id: deployment
        uses: actions/deploy-pages@v4
